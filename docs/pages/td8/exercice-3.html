<!doctype html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>Exercice 3</title>
    <link rel="stylesheet" href="../../assets/css/td8/exercice-3.css">
</head>
<body>
    <div class="formulaire">
        <h2><strong>Formulaire de contact</strong></h2>
        <p>Remplissez le formulaire ci-dessous pour nous contacter.</p>
        <form action="" method="post">
            <div class="responsive">
                <div class="name">
                    <label for="name">Nom : </label><br>
                    <input type="text" name="name" id="name" placeholder="Votre nom" required/>
                </div>
                <div class="email">
                    <label for="email">Email : </label><br>
                    <input type="email" name="email" id="email" placeholder="Votre email" required />
                </div>
                <div class="sujet">
                    <label for="sujet">Sujet : </label><br>
                    <input type="text" name="sujet" id="sujet" placeholder="Sujet" required />
                </div>
            </div>
            <div class="message">
                <label for="message">Message : </label><br>
                <input type="text" name="message" id="message" placeholder="Votre message" required />
            </div>
            <div class="submit">
                <input type="submit" value="Envoyer" />
            </div>
        </form>
    </div>
</body>
</html>
